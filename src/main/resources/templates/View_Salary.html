<!-- View_Employee.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employees List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        a.add-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a.add-btn:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .action-links a {
            margin: 0 5px;
            text-decoration: none;
            color: #007BFF;
        }
        .action-links a:hover {
            text-decoration: underline;
        }
        .action-links a.delete {
            color: red;
        }
    </style>
</head>
<body> 
    <h2>All Incentives</h2>
    <a href="/employees/salary-form" class="add-btn">Add Incentives</a>
    <a href="/employees/form" class="add-btn">Add Employees</a>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Designation</th>
            <th>Incentive</th>
            <th>Date and Time</th> <!-- Added column -->
        </tr>
        <tr th:each="salary : ${salaries}">
            <td th:text="${salary.id}"></td>
            <td th:text="${salary.name}"></td>
            <td th:text="${salary.email}"></td>
            <td th:text="${salary.designation}"></td>
            <td th:text="${salary.incentive}"></td>
            <td th:text="${salary.dateTime}"></td> 
        </tr>
    </table>
</body>
</html>
